[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchen-robot"
version = "0.1.0"
description = "Testing 1 prototype for a voice-first kitchen stirring robot."
requires-python = ">=3.11"
dependencies = [
  "bleak>=0.22.0",
  "numpy>=1.26.0",
  "openai>=1.0.0",
  "opencv-python>=4.9.0.80",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
kitchen-robot = "kitchen_robot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
